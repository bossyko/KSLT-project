<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Игрок — 768 и 844 после разбора границы</title>
<style>body{margin:0;background:#111;color:#fff;font:13px system-ui,sans-serif}
h1{font-size:14px;margin:10px 14px 2px;color:#CCFF00;letter-spacing:.04em}
p{margin:0 14px 8px;color:#999}
.ряд{display:flex;gap:14px;padding:0 14px 14px;align-items:flex-start}
.б{font-size:11px;color:#CCFF00;margin:0 0 4px}
.рамка{border:1px solid #333;overflow:hidden}
iframe{border:0;display:block}
#числа{padding:8px 14px;color:#CCFF00;font:12px monospace;white-space:pre}</style></head><body>
<h1>СТРАНИЦА ИГРОКА — ГРАНИЦА 768 РАЗЛОЖЕНА</h1>
<p>Слева планшет стоя 768: шапка в ряд, пилюли 96/92. Справа телефон лёжа 844 — уменьшен, чтобы влез.</p>
<div id="числа">меряю…</div>
<div class="ряд">
  <div><div class="б">768 × 1024</div><div class="рамка" style="width:768px;height:620px"><iframe id="a" src="../pages/player.html?id=azim-isakov&a=1" style="width:768px;height:620px"></iframe></div></div>
  <div><div class="б">844 × 390</div><div class="рамка" style="width:560px;height:620px"><iframe id="b" src="../pages/player.html?id=azim-isakov&b=1" style="width:844px;height:620px;transform:scale(0.663);transform-origin:0 0"></iframe></div></div>
</div>
<script>
setTimeout(() => {
  const строки = [];
  for (const [ид, им] of [['a','768'],['b','844']]) {
    const f = document.getElementById(ид), d = f.contentDocument, W = f.contentWindow;
    const q = s => { const e = d.querySelector(s); return e ? W.getComputedStyle(e) : null; };
    const h=q('.pp-header'), n=q('.pp-name'), st=q('.pp-stats'), c=q('.pp-cta');
    строки.push(им + ':  шапка ' + (h ? h.flexDirection : '—') +
      '   имя ' + (n ? n.fontSize : '—') +
      '   пилюли ' + (st ? st.gridTemplateColumns.split(' ').map(x=>Math.round(parseFloat(x))).join('/') : '—') +
      '   призыв ' + (c ? c.padding : '—') +
      '   гость: ' + (d.querySelector('.pp-guest-block') ? 'ДА — профиль закрыт' : 'нет'));
  }
  document.getElementById('числа').textContent = строки.join('\n');
}, 3500);
</script>
</body></html>
