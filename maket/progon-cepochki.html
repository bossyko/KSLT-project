<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КСЛТ — прогон цепочки этапов</title>
<!--
    СТЕНД С ПИШУЩЕЙ ЗАГЛУШКОЙ. Ничего не рисует: он гоняет настоящие функции
    этапов и отдаёт находки числами. Видом здесь проверять нечего, поэтому и
    вида нет — только строка о том, что прогон готов.

    ПОРЯДОК ЗАГРУЗКИ ВАЖЕН: заглушка ставит A.client ПОСЛЕ того, как
    bracket.js объявил свои функции, но ДО того, как их позовут.
-->
<link rel="stylesheet" href="../css/kslt-toast.css?v=35">
<style>
  body { margin: 0; padding: 24px; background: #0A0A0A; color: #EDEDED;
         font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  code { color: #CCFF00; }
</style>
</head>
<body>
<div id="progonGotov">прогон загружается…</div>

<!-- ПОЗИЦИИ СЕЯНЫХ: `SEED_POSITIONS` живут здесь, и bracket.js читает
     только их — запасных списков в нём больше нет (сведено 16.10) -->
<script src="../js/tournament-generator.js?v=4"></script>
<script src="../js/kslt-rules.js?v=29"></script>
<script src="../js/group-standings.js?v=8"></script>
<script src="../js/kslt-mesta.js?v=2"></script>
<script src="../js/rating-points.js?v=8"></script>
<script src="../js/tournament-status.js?v=1"></script>
<script src="../js/admin/core/constants.js?v=150"></script>
<script src="../js/kslt-toast.js?v=2"></script>
<script src="../js/admin/core/utils.js?v=45"></script>
<script src="../js/admin/core/layout.js?v=16"></script>
<script src="../js/admin/sections/players.js?v=64"></script>
<script src="../js/admin/sections/tournaments.js?v=68"></script>
<script src="../js/admin/sections/bracket.js?v=293"></script>
<script src="progon-zaglushka.js?v=1"></script>
<script src="progon-dvizhok.js?v=1"></script>
<script>
  document.getElementById('progonGotov').textContent =
      (window.ПРОГОН && window.ПРОГОН.одинРасклад && window.KSLT_ADMIN && window.KSLT_ADMIN.прогон)
          ? 'прогон готов' : 'ПРОГОН НЕ СОБРАЛСЯ';
</script>
</body>
</html>
