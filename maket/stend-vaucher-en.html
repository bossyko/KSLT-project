    <script>
    /* СТЕНД: браузер кеширует css по URL, а ?v= при правке файла не
       меняется — замер брал бы старую вёрстку. Здесь, и только здесь,
       адрес стиля получает метку времени. */
    document.write('<link rel="stylesheet" href="../css/verify.css?cb=' + Date.now() + '">');
    </script>

<body>
    <div class="stend-podpis">СТЕНД · данные подставные · ?sost=valid|used|invalid|expired &amp;&amp; ?yaz=ru|en|kg</div>
    <div class="vr-page">
        <div class="vr-header">
            <a href="../index-en.html" class="logo">
                <img src="../images/kslt-logo.svg" alt="КСЛТ" class="logo-img">
            </a>
        </div>
        <div class="vr-card" id="vrCard">
            <div class="vr-loading">Загрузка...</div>
        </div>
    </div>

    <style>
        .stend-podpis {
            position: fixed; top: 6px; left: 6px; z-index: 50;
            font: 11px/1.3 sans-serif; color: rgba(255,255,255,0.4);
        }
    </style>

    <script>
    /* Форма ответа снята с sql/схема/schema-snapshot.sql:5656-5665 (verify_voucher).
       Крайний случай: длинное имя, длинное название услуги и заведения.
       Кнопка подтверждения в базу не пишет: confirm_voucher тоже подставная. */
    (function(){
        var п = new URLSearchParams(location.search);
        var сост = п.get('sost') || 'valid';
        var ВАУЧЕР = {
            status: 'valid',
            player_name: 'Абдыкадырова Айсулуу Жусупбековна',
            entity_type: 'court',
            entity_name: 'Теннисный центр «Ала-Тоо», Бишкек',
            service_name: 'Аренда корта с покрытием hard, вечернее время',
            discount_percent: 15,
            expires_at: new Date(Date.now() + 36e5 * 30).toISOString(),
            created_at: new Date().toISOString()
        };
        var ОТВЕТЫ = {
            valid: ВАУЧЕР,
            used: { status: 'already_used', used_at: new Date(Date.now() - 36e5 * 5).toISOString() },
            invalid: { status: 'invalid' },
            expired: { status: 'expired' }
        };
        window.supabaseClient = {
            rpc: function(имя, арг){
                if (имя === 'verify_voucher') return Promise.resolve({ data: ОТВЕТЫ[сост] || ОТВЕТЫ.valid, error: null });
                if (имя === 'confirm_voucher') {
                    return Promise.resolve({ data: { status: арг.p_pin === '1234' ? 'confirmed' : 'wrong_pin' }, error: null });
                }
                return Promise.resolve({ data: null, error: null });
            }
        };
        if (!п.get('token')) {
            history.replaceState(null, '', location.pathname + '?' + (function(){
                п.set('token','stend'); return п.toString();
            })());
        }
    })();
    </script>
    <script src="../js/verify.js?v=2"></script>
</body>
