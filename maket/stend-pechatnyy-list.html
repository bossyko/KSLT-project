<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стенд: печатный лист отчёта</title>
<!--
    СТЕНД ПЕЧАТНОГО ЛИСТА — кусок 150, 23.10.

    ЗАЧЕМ ОН НУЖЕН, А НЕ ЖИВОЙ ЭКРАН. Все три отчёта — «Пользователи»,
    «Ваучеры», «Финансы» — живут В АДМИНКЕ, за входом, и пароля у меня
    нет. Лист открывается в НОВОМ ОКНЕ и печатается из его `onload`,
    поэтому проверять его можно только так: нажать кнопку, поймать
    открывшееся окно и померить лист внутри него.

    СТЕНД НЕУДОБНЫЙ НАМЕРЕНО, и каждая неудобность отвечает на свой вопрос:

    · ТРИ КНОПКИ — ровно три положения доводов, какие есть в продукте:
      плотный лист с разбивкой (как «Пользователи»), обычный с пятью
      плашками (как «Ваучеры») и обычный с четырьмя (как «Финансы»).
    · ДАННЫЕ С КАВЫЧКАМИ, АМПЕРСАНДОМ И УГЛОВОЙ СКОБКОЙ в заголовке, в
      периоде, в подписи плашки и в подписи колонки: дом получает их
      ТЕКСТОМ и обязан погасить сам. Если перестанет — разметка листа
      порвётся, и это видно замером, а не на глаз.
    · РАЗБИВКА ПРИХОДИТ ГОТОВОЙ РАЗМЕТКОЙ — так её отдаёт раздел. Внутри
      стоит `<span>`, и он обязан дойти до листа ЖИВЫМ тегом: это вторая
      половина шва, и стенд держит обе.
    · ПЕЧАТЬ ПЕРЕХВАЧЕНА: `window.print` в открытом окне подменяется
      счётчиком, иначе прогон упёрся бы в системный диалог печати.
-->
<style>
  body { background: #0a0a0a; color: #ddd; font: 14px/1.6 system-ui, sans-serif; padding: 20px; }
  .st-podpis { color: #888; margin-bottom: 16px; }
  .st-knopka { background: #1a1a1a; color: #cfff4f; border: 1px solid #333; padding: 8px 12px; cursor: pointer; margin-right: 8px; }
</style>
</head>
<body>

<p class="st-podpis">СТЕНД · данные подставные, в базу не пишется · дом <code>A.печатныйЛист</code>, кусок 150</p>

<button class="st-knopka" id="stPolzovateli">лист «Пользователи» (плотный + разбивка)</button>
<button class="st-knopka" id="stVauchery">лист «Ваучеры» (пять плашек)</button>
<button class="st-knopka" id="stFinansy">лист «Финансы» (четыре плашки)</button>

<script src="../js/kslt-ekranirovanie.js?v=1"></script>
<script>
    /* ДОМ ЭКРАНИРОВАНИЯ — ТОТ ЖЕ, ЧТО В ПРОДУКТЕ (кусок 141): админка
       зовёт его через `A.esc`, и стенд ставит ровно этот переходник, а не
       свою копию. */
    window.KSLT_ADMIN = window.KSLT_ADMIN || {};
    window.KSLT_ADMIN.esc = function (s) { return KSLT_экранировать(s == null ? '' : String(s)); };
    window.KSLT_ADMIN.client = null;
</script>
<script src="../js/admin/core/export.js?v=21"></script>
<script>
(function () {
    'use strict';
    var A = window.KSLT_ADMIN;

    /* ДАННЫЕ НЕУДОБНЫЕ НАМЕРЕНО. */
    var ЗЛОЙ = 'Отчёт "за месяц" & <b>март</b>';

    var строки =
        '<tr><td>1</td><td>Иванов &amp; сын</td><td>&lt;кавычки&gt;</td><td>100</td></tr>' +
        '<tr><td>2</td><td>Петров</td><td>обычный</td><td>200</td></tr>';

    function открыть(о) {
        var окно = A.печатныйЛист(о);
        /* ПЕЧАТЬ ПЕРЕХВАЧЕНА В ОТКРЫТОМ ОКНЕ, иначе системный диалог
           остановит прогон. Считаем зовы: лист обязан позвать печать
           РОВНО ОДИН раз и только после отрисовки. */
        if (окно) {
            окно.__печатей = 0;
            окно.print = function () { окно.__печатей++; };
            window.__лист = окно;
        }
        return окно;
    }

    document.getElementById('stPolzovateli').onclick = function () {
        открыть({
            заголовок: ЗЛОЙ,
            периодПодпись: 'Период',
            период: 'март & "апрель"',
            плотный: true,
            плашки: [
                { значение: 499, подпись: 'Всего & людей' },
                { значение: 12, подпись: 'С членством' },
                { значение: 7, подпись: 'С карточкой' }
            ],
            разбивка: '<span>3</span> админа · <span>1</span> менеджер',
            колонки: ['№', 'Человек', 'Почта & связь', 'Роль'],
            строки: строки,
            подвалСлева: 'Всего: 499 человек',
            подвалСправа: 'Дата: 23.10.2026'
        });
    };

    document.getElementById('stVauchery').onclick = function () {
        открыть({
            заголовок: 'Ваучеры',
            периодПодпись: 'Период',
            период: 'всё время',
            плашки: [
                { значение: 34, подпись: 'Выдано' },
                { значение: '12 500 сом', подпись: 'Сумма скидок' },
                { значение: '8 (23%)', подпись: 'Использовано' },
                { значение: 20, подпись: 'Действующих' },
                { значение: 6, подпись: 'Истекло' }
            ],
            колонки: ['№', 'Игрок', 'Заведение', 'Услуга', 'Скидка', 'Дата', 'Состояние'],
            строки: строки,
            подвалСлева: 'Всего: 34 ваучера',
            подвалСправа: 'Дата: 23.10.2026'
        });
    };

    document.getElementById('stFinansy').onclick = function () {
        открыть({
            заголовок: 'Оплаты',
            периодПодпись: 'Период',
            период: 'этот месяц',
            плашки: [
                { значение: 7, подпись: 'Оплат' },
                { значение: '70 000 KGS', подпись: 'Сумма' },
                { значение: 5, подпись: 'Действующих' },
                { значение: 2, подпись: 'Истекло' }
            ],
            колонки: ['№', 'Заведение', 'Вид', 'Сумма', 'До', 'Состояние', 'Создано'],
            строки: строки,
            подвалСлева: 'Всего: 7 оплат',
            подвалСправа: 'Дата: 23.10.2026'
        });
    };

    window.СТЕНД = { ЗЛОЙ: ЗЛОЙ, строки: строки };
})();
</script>
</body>
</html>
