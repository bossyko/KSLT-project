    <link rel="stylesheet" href="../css/tokens.css?v=72">
    <link rel="stylesheet" href="../css/scoreboard.css?v=32">
    <script>
    /* СТЕНД: браузер кеширует css по URL, а ?v= при правке файла не
       меняется — замер брал бы старую вёрстку. Здесь, и только здесь,
       адрес стиля получает метку времени. */
    document.write('<link rel="stylesheet" href="../css/scoreboard.css?cb=' + Date.now() + '">');
    </script>
    <!-- СТЕНД: подложка вместо кадра OBS. В продукте фон прозрачный. -->
    <style>
        body { background: #1e3a1e !important; }
        .stend-podpis { position: fixed; top: 8px; left: 8px;
            font: 12px/1.3 sans-serif; color: rgba(255,255,255,0.55); }
    </style>
</head>
<body>
    <div class="stend-podpis">СТЕНД · данные подставные · ?sost=live|paused|break|warmup|completed</div>
    <div id="sb-wrapper">
        <div class="sb-logos" id="sb-logos"></div>
        <div id="sb-pause"></div>
        <div id="sb-root"></div>
    </div>

    <script src="../js/live-texts.js?v=1"></script>
    <script>
    /* Форма данных снята с sql/схема/live-match-migration.sql:7-34 и
       sql/схема/live-pereryvy.sql (pause_reason, break_kind, break_until).
       Крайний случай: парный разряд, кыргызские фамилии, четыре сыгранных
       сета при best_of 5, идущий тай-брейк пятого. */
    (function(){
        var сост = new URLSearchParams(location.search).get('sost') || 'live';
        var МАТЧ = {
            id: 'stend',
            status: (сост === 'break' ? 'live' : сост),
            best_of: 5,
            player1_name: 'Жусупбекова / Абдыкадырова',
            player2_name: 'Боруев / Сулейманов-Ким',
            serving_player: 1,
            sets_data: [{g1:6,g2:4},{g1:4,g2:6},{g1:7,g2:6},{g1:3,g2:6}],
            current_game_p1: 6,
            current_game_p2: 6,
            is_tiebreak: true,
            tiebreak_p1: 10,
            tiebreak_p2: 9,
            points_p1: '40',
            points_p2: 'AD',
            pause_reason: (сост === 'paused' ? 'medical' : null),
            break_kind:   (сост === 'break' ? 'set_break' : null),
            break_until:  (сост === 'break' ? new Date(Date.now() + 90000).toISOString() : null),
            sponsor_logo: "../images/kslt-logo.svg"
        };
        function обещание(з){ return { then: function(f){ f(з); return обещание(з); } }; }
        function цепь(о){
            var x = {};
            ['select','in','eq','order','limit','single'].forEach(function(м){ x[м] = function(){ return x; }; });
            x.then = function(f){ f(о); return обещание(о); };
            return x;
        }
        window.supabaseClient = {
            from: function(){ return цепь({ data: МАТЧ, error: null }); },
            channel: function(){ return { on: function(){ return this; }, subscribe: function(){ return this; }, unsubscribe: function(){} }; }
        };
    })();
    </script>
    <script src="../js/scoreboard.js?v=2"></script>
</body>
</html>
