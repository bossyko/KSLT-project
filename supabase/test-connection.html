<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KSLT — Supabase Test</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: Inter, sans-serif; padding: 40px; }
        h1 { color: #CCFF00; }
        .status { padding: 16px; border-radius: 8px; margin: 16px 0; font-size: 18px; }
        .ok { background: rgba(0,255,0,0.1); border: 1px solid #0f0; }
        .fail { background: rgba(255,0,0,0.1); border: 1px solid #f00; }
        .data { background: rgba(204,255,0,0.05); border: 1px solid #333; border-radius: 8px; padding: 16px; margin: 16px 0; }
        pre { color: #ccc; font-size: 14px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>KSLT — Supabase Connection Test</h1>
    <div id="result">Connecting...</div>

    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        (async function() {
            var el = document.getElementById('result');
            try {
                var SUPABASE_URL = 'https://qqkzszesviukopgjbead.supabase.co';
                var SUPABASE_ANON_KEY = 'sb_publishable_JGfk-NkMln4w7iMzhYEigg_z1_2XK7G';
                var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                if (!client) throw new Error('Client not initialized');

                // Test: read categories
                var { data, error } = await client
                    .from('categories')
                    .select('*')
                    .order('sort_order');

                if (error) throw error;

                var html = '<div class="status ok">Connected! ' + data.length + ' categories found</div>';
                html += '<div class="data"><pre>' + JSON.stringify(data, null, 2) + '</pre></div>';
                el.innerHTML = html;
            } catch (err) {
                el.innerHTML = '<div class="status fail">Error: ' + err.message + '</div>';
            }
        })();
    </script>
</body>
</html>
