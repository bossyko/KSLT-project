<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg1)"/>
  <!-- Tennis ball -->
  <circle cx="256" cy="220" r="120" fill="#CCFF00" opacity="0.95"/>
  <!-- Ball seam lines -->
  <path d="M160 160 C200 220, 200 220, 160 280" stroke="#0A0A0A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M352 160 C312 220, 312 220, 352 280" stroke="#0A0A0A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- KSLT text -->
  <text x="256" y="400" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="80" fill="#FFFFFF" letter-spacing="8">KSLT</text>
  <!-- Subtle glow -->
  <circle cx="256" cy="220" r="120" fill="none" stroke="#CCFF00" stroke-width="2" opacity="0.3"/>
</svg>
