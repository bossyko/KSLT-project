    <title>KSLT Scoreboard</title>
    <meta name="description" content="KSLT Scoreboard — КСЛТ, теннисное сообщество Кыргызстана.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="КСЛТ">
    <meta property="og:title" content="KSLT Scoreboard">
    <meta property="og:description" content="KSLT Scoreboard — КСЛТ, теннисное сообщество Кыргызстана.">
    <meta property="og:url" content="https://bossyko.github.io/KSLT-project/pages/scoreboard.html">
    <meta property="og:image" content="https://bossyko.github.io/KSLT-project/images/KSLT.png">

    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; font-family: 'Inter', sans-serif; overflow: hidden; }

        #sb-wrapper { position: fixed; bottom: 20px; left: 20px; }

        .sb-board {
            background: rgba(10,10,10,0.88);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 320px;
        }

        .sb-row {
            display: flex;
            align-items: center;
            padding: 6px 14px;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .sb-row:last-child { border-bottom: none; }

        .sb-name {
            flex: 1;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }

        .sb-serve {
            font-size: 0.75rem;
            margin-right: 6px;
            vertical-align: middle;
        }

        .sb-scores {
            display: flex;
            gap: 2px;
        }

        .sb-set-val, .sb-game-val, .sb-pts-val {
            width: 30px;
            text-align: center;
            font-size: 1rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #fff;
            padding: 2px 0;
        }
        .sb-game-val {
            color: #CCFF00;
        }
        .sb-pts-val {
            color: #CCFF00;
            background: rgba(204,255,0,0.1);
            border-radius: 4px;
        }

        /* Logos bar — above scoreboard */
        .sb-logos {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .sb-logo-img {
            height: 36px;
            object-fit: contain;
            border-radius: 4px;
        }
        .sb-logo-kslt {
            height: 32px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div id="sb-wrapper">
        <div class="sb-logos" id="sb-logos"></div>
        <div id="sb-root"></div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/scoreboard.js"></script>
</body>
</html>
